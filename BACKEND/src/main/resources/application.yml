# ============================================================
# POS Backend — application.yml
# Default profile: PostgreSQL + Redis cache
# ============================================================
spring:
  application:
    name: pos-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db
    username: ${DB_USERNAME:pos_user}
    password: ${DB_PASSWORD:pos_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  security:
    user:
      name: admin
      password: admin

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.pos: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n"

# ============================================================
# POS custom properties
# ============================================================
pos:
  tax:
    rate: 0.19
  jwt:
    secret: pos-backend-secret-key-for-hs256-algorithm-minimum-256-bits
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200

---
# ============================================================
# Test profile: H2 in-memory + Caffeine cache
# ============================================================
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  h2:
    console:
      enabled: true

pos:
  tax:
    rate: 0.19
  jwt:
    secret: pos-backend-secret-key-for-hs256-algorithm-minimum-256-bits
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200
